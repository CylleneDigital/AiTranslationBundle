name: Build

on:
    push:
        branches:
            - main
    pull_request: ~
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6"
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The suite runs on SQLite with no service at all — what a contributor gets from a
    # bare clone. Static analysis and code style live here so they run once per PHP
    # version rather than once per database.
    tests:
        runs-on: ubuntu-latest

        name: "PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]
                # highest exercises the top of the Symfony range (^7.4 || ^8.0),
                # lowest the committed floors (Symfony 7.4, DBAL 3.9, DoctrineBundle
                # 2.13).
                dependencies: [highest, lowest]

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl, mbstring, xml, ctype, iconv, pdo_sqlite
                    coverage: none

            -
                name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Run tests
                run: vendor/bin/phpunit --colors=always

            # Against the newest dependencies only: code bridging two library versions
            # (DBAL's in-place setters and its 4.5 editors) cannot type-check on both.
            -
                name: Run PHPStan
                if: matrix.dependencies == 'highest'
                run: vendor/bin/phpstan analyse --ansi --no-progress --memory-limit=1G

            -
                name: Check code style
                run: vendor/bin/php-cs-fixer check --diff --ansi

    # The entity mapping is what diverges per platform: a unique index on a nullable
    # column, a 400-character key under InnoDB's 3072-byte ceiling, DQL the ORM renders
    # differently. SQLite cannot prove any of it, so every engine the README promises
    # gets a real run.
    databases:
        runs-on: ubuntu-latest

        name: "${{ matrix.database.name }}"

        strategy:
            fail-fast: false
            matrix:
                database:
                    -
                        name: "MariaDB 11.8"
                        image: "mariadb:11.8"
                        ports: "3306:3306"
                        dsn: "mysql://app:app@127.0.0.1:3306/ai_translation_test?charset=utf8mb4&serverVersion=mariadb-11.8.0"
                        health: "--health-cmd \"healthcheck.sh --connect --innodb_initialized\""
                        extension: "pdo_mysql"
                    -
                        name: "MySQL 8.4"
                        image: "mysql:8.4"
                        ports: "3306:3306"
                        dsn: "mysql://app:app@127.0.0.1:3306/ai_translation_test?charset=utf8mb4&serverVersion=8.4.0"
                        health: "--health-cmd \"mysqladmin ping -h 127.0.0.1 -uroot -proot\""
                        extension: "pdo_mysql"
                    -
                        name: "PostgreSQL 17"
                        image: "postgres:17-alpine"
                        ports: "5432:5432"
                        dsn: "postgresql://app:app@127.0.0.1:5432/ai_translation_test?serverVersion=17&charset=utf8"
                        health: "--health-cmd \"pg_isready -U app -d ai_translation_test\""
                        extension: "pdo_pgsql"

        services:
            database:
                image: ${{ matrix.database.image }}
                # Every engine's variables at once: each image ignores the ones it does
                # not know, which keeps a single service block for the whole matrix.
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: ai_translation_test
                    MARIADB_USER: app
                    MARIADB_PASSWORD: app
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: ai_translation_test
                    MYSQL_USER: app
                    MYSQL_PASSWORD: app
                    POSTGRES_DB: ai_translation_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                ports:
                    - ${{ matrix.database.ports }}
                options: >-
                    ${{ matrix.database.health }}
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            APP_ENV: test
            DATABASE_URL: ${{ matrix.database.dsn }}

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    extensions: intl, mbstring, xml, ctype, iconv, ${{ matrix.database.extension }}
                    coverage: none

            -
                name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist

            -
                name: Run tests
                run: vendor/bin/phpunit --colors=always

    # intl is optional (the ICU formatting of an override and \Locale are guarded): a
    # run without it proves the guards, the tests that need it being skipped.
    without-intl:
        runs-on: ubuntu-latest

        name: "Without intl"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    extensions: :intl, mbstring, xml, ctype, iconv, pdo_sqlite
                    coverage: none

            -
                name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist

            -
                name: Run tests
                run: vendor/bin/phpunit --colors=always

    build:
        runs-on: ubuntu-latest
        name: "Build complete"
        needs: [tests, databases, without-intl]
        if: always()

        steps:
            -
                name: Fail unless every matrix job succeeded
                run: |
                    [ "${{ needs.tests.result }}" = "success" ] || exit 1
                    [ "${{ needs.databases.result }}" = "success" ] || exit 1
                    [ "${{ needs.without-intl.result }}" = "success" ] || exit 1
