name: Report a bug
description: Unexpected behaviour of the bundle
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              ⚠️ **A security flaw is not reported here.** See [SECURITY.md](https://github.com/CylleneDigital/AiTranslationBundle/blob/main/SECURITY.md).

              **Never paste an API key** in a public issue - not even truncated.
    - type: input
      id: bundle-version
      attributes:
          label: Bundle version
      validations:
          required: true
    - type: input
      id: symfony-version
      attributes:
          label: Symfony version
      validations:
          required: true
    - type: input
      id: php-version
      attributes:
          label: PHP version
      validations:
          required: true
    - type: dropdown
      id: database
      attributes:
          label: Database
          options:
              - MySQL
              - MariaDB
              - PostgreSQL
              - SQLite
              - Other
      validations:
          required: true
    - type: dropdown
      id: area
      attributes:
          label: What the issue concerns
          options:
              - Catalogue scanning (translations/ files, additional_paths)
              - Overrides at runtime (the decorated translator, caches)
              - AI generation or review (providers, suggestions, cost estimate)
              - Import / export
              - Coverage
              - The interactive console or a CLI command
              - I do not know
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behaviour
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Observed behaviour
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: "The configuration, the file names involved and the locale at play are usually what matters."
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs or stack trace
          description: "Redact every sensitive value before pasting."
          render: text
